# Render Blueprint for LiquorPriceBook
# Deploy: connect this repo to Render, choose "Blueprint", select this file.
# Docs: https://render.com/docs/blueprint-spec
#
# Cost-optimised layout (Option A, ~$14/mo):
#   - lpb-db (Postgres, $7)
#   - lpb-api (FastAPI web service, $7) - also handles PDF ingestion in-process
#     via FastAPI BackgroundTasks, so we don't pay for a separate worker.
#   - lpb-web (React SPA, static site, free) - served at ordering.celr.ai
#
# Custom domains:
#   - App:  https://ordering.celr.ai      -> lpb-web
#   - API:  https://api.ordering.celr.ai  -> lpb-api
#
# When we get to Week 11 (alert digests + scheduled work) we'll add back a
# worker + cron job. Until then, the API does everything synchronously or
# via BackgroundTasks.

databases:
  - name: lpb-db
    databaseName: liquorpricebook
    plan: basic-256mb
    region: ohio
    postgresMajorVersion: "16"
    ipAllowList: []   # private only; access via internal connection string

services:
  # -------------------------------------------------------------------------
  # API: FastAPI web service. Public HTTPS endpoint. Also runs PDF ingestion
  # in-process via BackgroundTasks (saves the $7/mo cost of a worker).
  # -------------------------------------------------------------------------
  - type: web
    name: lpb-api
    runtime: python
    region: ohio
    plan: starter
    buildCommand: pip install -e .
    # Runs once after build + before the new instance receives traffic.
    # Migrations land here so the DB is in sync before the new app version
    # starts serving requests.
    preDeployCommand: alembic upgrade head
    startCommand: uvicorn lpb_api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    autoDeploy: true
    domains:
      - api.ordering.celr.ai
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: lpb-db
          property: connectionString
      - key: APP_ENV
        value: production
      - key: APP_DOMAIN
        value: ordering.celr.ai
      - key: WEB_ORIGIN
        value: https://ordering.celr.ai
      # Interim static admin auth. Override in the Render dashboard for any
      # public deploy (and replace with Clerk JWT verification once wired).
      - key: LPB_ADMIN_USERNAME
        value: admin
      - key: LPB_ADMIN_PASSWORD
        sync: false
      - key: LPB_ADMIN_TOKEN
        sync: false
      # secrets - set in Render dashboard, NOT committed
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: SENTRY_DSN
        sync: false

  # -------------------------------------------------------------------------
  # Web: React SPA, static site. Served globally from Render's edge CDN.
  # -------------------------------------------------------------------------
  - type: web
    name: lpb-web
    runtime: static
    # Static sites are global at Render's edge and don't take a region or plan.
    buildCommand: cd web && npm ci && npm run build
    staticPublishPath: web/dist
    pullRequestPreviewsEnabled: true
    domains:
      - ordering.celr.ai
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://api.ordering.celr.ai
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
